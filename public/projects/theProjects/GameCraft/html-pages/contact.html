    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="header-logo">
                <span class="game">GAME</span><span class="craft">CRAFT</span>
            </div>
            <nav id="navLinks">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="games.html">Games</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">>Contact</a></li>
                </ul>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <img src="../assets/img/hamburger-menu.svg" alt="Menu">
            </button>
        </div>
    </header>
    <div class="shape shape_slide_right"></div>

    <div class="border-contact-box">
        <h1 class="title-contact">SEND US <span class="title-us">A MESSAGE</span></h1>

        <form>
            <div class="row">
                <div class="input-wrapper">
                    <input class="contact-input" type="text" placeholder="first name" required>
                </div>
                <div class="input-wrapper2">
                    <input class="contact-input2" type="text" placeholder="last name" required>
                </div>
            </div>

            <div class="row">
                <div class="input-wrapper">
                    <input class="contact-input" type="email" placeholder="Email address" required>
                </div>
                <div class="input-wrapper2">
                    <input class="contact-input2" type="text" placeholder="phone number">
                </div>
            </div>

            <div class="row">
                <div class="textarea-wrapper">
                    <textarea name="message" placeholder="Message" required></textarea>
                </div>
            </div>

            <button class="submit-btn" type="submit" id="submit-btn">SUBMIT</button>
        </form>
    </div>


</body>
<script src="../assets/js/contact.js"></script>
<script src="../assets/js/main.js"></script>
